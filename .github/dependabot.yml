version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Disable version-update PRs; security updates are not subject to this limit.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope
